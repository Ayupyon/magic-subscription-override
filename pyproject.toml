[project]
name = "magic-subscription-override"
version = "0.1.0"
description = "A small Clash subscription override service"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2,<7"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.basedpyright]
typeCheckingMode = "standard"
include = ["subscription_override.py", "tests", "config/overrides"]
venvPath = "."
venv = ".venv"
